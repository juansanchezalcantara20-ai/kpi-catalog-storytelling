site_name: Indicadores que se entienden
site_description: Un catálogo de indicadores, un motor de cálculo y dos presentaciones - historias y tablero.
site_author: Juan Luis Sánchez Alcántara
repo_url: https://github.com/juansanchezalcantara20-ai/kpi-catalog-storytelling
edit_uri: ""
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: es
  custom_dir: overrides
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tooltips
    - toc.follow
  icon:
    logo: material/chart-box-outline

extra_css:
  - assets/css/extra.css
extra_javascript:
  - assets/js/tooltips.js
  - assets/js/simulador.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [includes]
      auto_append: [glosario.md]
      check_paths: true

nav:
  - Resumen para gerencia: resumen.md
  - Inicio: index.md
  - Casos:
      - 1 · Atención de solicitudes: cases/service.md
      - 2 · Mantenimiento: cases/maintenance.md
      - 3 · Inventario: cases/inventory.md
      - 4 · Clientes: cases/customers.md
      - 5 · Calidad de los datos: cases/data_quality.md
  - Errores comunes al medir: antipatterns.md
  - Catálogo de indicadores: catalog/index.md
  - Tablero: dashboard/index.html
  - Cómo leer este sitio: como-leer.md
  - Fuentes de datos: data-sources.md
  - Decisiones del proyecto: DECISIONS.md
