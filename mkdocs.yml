site_name: Indicadores que se entienden
site_description: Un catálogo de indicadores, un motor de cálculo y dos presentaciones - historias y tablero.
site_author: Juan Luis Sánchez Alcántara
repo_url: https://github.com/juansanchezalcantara20-ai/kpi-catalog-storytelling
edit_uri: ""
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: es
  custom_dir: overrides
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tooltips
    - toc.follow
  icon:
    logo: material/chart-box-outline

extra_css:
  - assets/css/extra.css
extra_javascript:
  - assets/js/tooltips.js
  - assets/js/simulador.js
  - assets/js/rubros.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [includes]
      auto_append: [glosario.md]
      check_paths: true

nav:
  - Inicio: index.md
  - Resumen para gerencia: resumen.md
  - Por rubro:
      - Todos los rubros: rubros/index.md
      - Banca, seguros y AFP: rubros/banca.md
      - Retail: rubros/retail.md
      - Logística y transporte: rubros/logistica.md
      - Minería: rubros/mineria.md
      - Telecomunicaciones: rubros/telecom.md
      - Salud: rubros/salud.md
      - Energía: rubros/energia.md
      - Educación: rubros/educacion.md
      - Servicios y atención: rubros/servicios.md
  - Por tema:
      - Todos los temas: temas/index.md
      - Operaciones y procesos: temas/operaciones.md
      - Costos y finanzas: temas/costos.md
      - Cliente y calidad de servicio: temas/cliente.md
      - Mantenimiento y activos: temas/mantenimiento.md
      - Inventario y cadena de suministro: temas/inventario.md
      - Personas: temas/personas.md
      - Calidad de datos: temas/datos.md
  - Catálogo: catalog/index.md
  - Tablero: dashboard/index.html
  - Cómo leer este sitio:
      - Guía de lectura: como-leer.md
      - Errores comunes al medir: antipatterns.md
      - Decisiones del proyecto: DECISIONS.md
  - Fuentes: data-sources.md
