vuelos:
  nombre: "Flights 200k (atraso de salida de vuelos comerciales)"
  publicador: "Oficina de Estadísticas de Transporte de Estados Unidos, reporte obligatorio de puntualidad; muestra publicada por vega-datasets"
  licencia: "Datos públicos del gobierno de Estados Unidos; repositorio vega-datasets bajo BSD-3"
  pagina: "https://github.com/vega/vega-datasets"
  descarga: "https://raw.githubusercontent.com/vega/vega-datasets/main/data/flights-200k.json"
  tipo: real
  rubros: [logistica]
  minimo_filas: 150000
  filtros: "200 000 vuelos con atraso en minutos, distancia y hora de salida; sin aerolínea ni fecha"

creditos:
  nombre: "Cartera de créditos por tipo de entidad, segmento y región (simulada)"
  publicador: "Simulación de este proyecto, semilla 2031"
  licencia: "MIT (código de este repositorio)"
  tipo: simulado
  rubros: [banca]
  # Se buscó una fuente pública estable: las series de morosidad del Banco Central de Reserva del
  # Perú (BCRPData) tienen una API abierta, pero no se pudo verificar desde el entorno de
  # desarrollo; las bases de la Superintendencia se publican en hojas de cálculo sin una dirección
  # estable. Por eso este caso usa datos simulados y lo dice en cada página.
  filtros: "24 meses, 4 tipos de entidad, 4 segmentos y 5 regiones"
  candidata: "https://estadisticas.bcrp.gob.pe/estadisticas/series/api/PN07746EM/json"

# Fuentes que se evaluaron y no se usaron, con el motivo (se muestran en la página «Fuentes»).
descartadas:
  - fuente: "Banco Central de Reserva del Perú, series estadísticas (BCRPData)"
    rubros: [banca, mineria, energia]
    motivo: "Tiene una interfaz abierta sin clave (morosidad bancaria, producción minera, electricidad), pero su dirección no respondió desde el entorno de desarrollo, así que no se pudo verificar el formato. Queda como candidata."
  - fuente: "Superintendencia de Banca, Seguros y AFP (estadísticas del sistema financiero)"
    rubros: [banca]
    motivo: "Se publica en hojas de cálculo mensuales sin una dirección de descarga estable."
  - fuente: "Ministerio de Energía y Minas (boletines estadísticos)"
    rubros: [mineria, energia]
    motivo: "Se publican en PDF y hojas de cálculo con formato cambiante; no se encontró una descarga estable."
  - fuente: "Portal de datos abiertos del Perú (reclamos de telecomunicaciones y de salud)"
    rubros: [telecom, salud]
    motivo: "No se encontró un archivo con fechas de apertura y cierre que se pueda descargar de forma estable."
  - fuente: "Kaggle y otras plataformas que piden cuenta"
    rubros: [banca, telecom, retail]
    motivo: "Requieren crear una cuenta o una clave de acceso; el proyecto no usa ninguna."
