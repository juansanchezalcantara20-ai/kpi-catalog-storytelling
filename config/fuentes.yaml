  publicador: "Unión Internacional de Telecomunicaciones, vía Our World in Data; publicado en TidyTuesday (2020-11-10)"
  licencia: "CC BY 4.0 (Our World in Data); repositorio TidyTuesday bajo CC0"
  pagina: "https://github.com/rfordatascience/tidytuesday/tree/master/data/2020/2020-11-10"
  descarga: "https://raw.githubusercontent.com/rfordatascience/tidytuesday/master/data/2020/2020-11-10/mobile.csv"
