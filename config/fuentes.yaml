# Fuentes de datos públicas. La descarga corre en GitHub Actions (workflow "Actualizar datos").
# Si una descarga falla, el sitio vuelve a los datos simulados y lo dice en cada página.
# Ninguna fuente requiere cuenta ni clave de API.

# Campos comunes: nombre, publicador, licencia, pagina (dónde leer sobre la fuente), descarga o api,
# tipo (real o simulado), rubros y filtros. La fecha de descarga y las filas se registran en cada
# actualización (data/processed/manifest.json) y se muestran en la página «Fuentes».

solicitudes:
  # Caso · Atención de solicitudes
  nombre: "NYC 311 Service Requests"
  publicador: "NYC Open Data (Ciudad de Nueva York)"
  licencia: "Términos de uso de NYC Open Data (datos abiertos, uso libre)"
  tipo: real
  rubros: [servicios]
  pagina: "https://data.cityofnewyork.us/Social-Services/311-Service-Requests-from-2010-to-Present/erm2-nwe9"
  api: "https://data.cityofnewyork.us/resource/erm2-nwe9.csv"
  # Solo columnas sin datos personales: nunca direcciones, coordenadas ni textos libres.
  columnas: [unique_key, created_date, closed_date, agency, complaint_type, open_data_channel_type, status, borough]
  filtros:
    agencia: "DOT"            # Departamento de Transporte: alumbrado, calzadas, semáforos, veredas
  periodo:
    meses: 12                 # 12 meses completos...
    corte: fin_mes_anterior   # ...que terminan el último día del mes anterior a la descarga
  paginacion:
    tamano_pagina: 50000
    maximo_filas: 800000
  minimo_filas: 5000          # menos que esto = descarga incompleta -> se usa el plan B
  reintentos: 4
  # Supuesto propio (no es una regla oficial de la ciudad): prioridad y plazo según el tipo de solicitud.
  plazos_por_prioridad_horas:
    Urgente: 24
    Alta: 72
    Media: 168
    Baja: 336
  tipos:
    "Traffic Signal Condition": {etiqueta: "Semáforos", prioridad: Urgente}
    "Street Light Condition": {etiqueta: "Alumbrado público", prioridad: Alta}
    "Street Condition": {etiqueta: "Estado de la calzada", prioridad: Alta}
    "Highway Condition": {etiqueta: "Autopistas", prioridad: Alta}
    "Bridge Condition": {etiqueta: "Puentes", prioridad: Urgente}
    "Sidewalk Condition": {etiqueta: "Veredas", prioridad: Media}
    "Curb Condition": {etiqueta: "Sardineles", prioridad: Media}
    "Street Sign - Damaged": {etiqueta: "Señales de tránsito", prioridad: Media}
    "Street Sign - Missing": {etiqueta: "Señales de tránsito", prioridad: Media}
    "Street Sign - Dangling": {etiqueta: "Señales de tránsito", prioridad: Alta}
    "Broken Parking Meter": {etiqueta: "Parquímetros", prioridad: Baja}
    "Broken Muni Meter": {etiqueta: "Parquímetros", prioridad: Baja}
  tipo_por_defecto: {etiqueta: "Otros", prioridad: Media}
  maximo_equipos: 5           # los tipos más frecuentes se muestran; el resto va a "Otros"
  canales:
    PHONE: "Teléfono"
    ONLINE: "Web"
    MOBILE: "App móvil"
    UNKNOWN: "Otro"
    OTHER: "Otro"

mantenimiento:
  nombre: "AI4I 2020 Predictive Maintenance Dataset"
  publicador: "UCI Machine Learning Repository (Matzka, 2020)"
  licencia: "CC BY 4.0"
  pagina: "https://archive.ics.uci.edu/dataset/601/ai4i+2020+predictive+maintenance+dataset"
  descarga: "https://archive.ics.uci.edu/static/public/601/ai4i+2020+predictive+maintenance+dataset.zip"
  # El propio publicador lo describe como un conjunto sintético que refleja datos reales de
  # mantenimiento predictivo: es una referencia pública, no la operación de una mina real.
  tipo: referencia
  rubros: [mineria]
  filtros: "10 000 ciclos de máquina; se agrupan en 20 máquinas y 12 meses"

ventas:
  nombre: "Online Retail II"
  publicador: "UCI Machine Learning Repository (Chen, 2019)"
  licencia: "CC BY 4.0"
  pagina: "https://archive.ics.uci.edu/dataset/502/online+retail+ii"
  descarga: "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip"
  tipo: real
  rubros: [retail]
  filtros: "todas las facturas de dic 2009 a dic 2011; sin nombres de clientes (solo un número)"

energia:
