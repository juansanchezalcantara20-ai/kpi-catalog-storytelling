# Catálogo de indicadores: la única fuente de verdad.
#
# Cada indicador se define aquí una sola vez. El motor de cálculo (src/kpistory), el sitio
# de historias, el tablero y las consultas SQL de referencia se derivan de este archivo.
# Esquema: kpis/catalog.schema.json  -  Validar con: kpistory validate
#
# Convenciones (los nombres de campo y los ids quedan en inglés; los textos, en español)
#   * Las proporciones se guardan como fracción (0.92) y se muestran como "92.0 %".
#   * thresholds.green / thresholds.amber son los límites del semáforo:
#       higher_is_better -> en meta si valor >= green, vigilar si >= amber, si no actuar
#       lower_is_better  -> en meta si valor <= green, vigilar si <= amber, si no actuar
#       target_range     -> en meta dentro de [green], vigilar dentro de [amber], si no actuar
#   * sql puede usar parámetros como ${nombre}; se sustituyen desde `params`.
#   * Las metas son ilustrativas: se fijaron para los datos públicos o simulados de este
#     portafolio, no para ninguna organización real.

version: 1
cases:
  service:
    title: Atención de solicitudes
    tables:
    - tickets
  maintenance:
    title: Mantenimiento de equipos
    tables:
    - work_orders
    - asset_periods
  inventory:
    title: Inventario y demanda
    tables:
    - order_lines
    - inventory_daily
    - inventory_snapshot
    - forecast
  customers:
    title: Clientes
    tables:
    - sales
    - customer_rfm
    - survey
  data_quality:
    title: Calidad de los datos
    tables:
    - dq_results
kpis:
- id: first_response_time
  name: Tiempo hasta la primera respuesta
  case: service
  question: ¿Cuánto espera un cliente hasta que una persona le responde?
  meaning: Horas que pasan desde que llega la solicitud hasta la primera respuesta de una persona.
  definition: Mediana de horas entre la creación de la solicitud y la primera respuesta de un agente, sobre las
    solicitudes que ya recibieron respuesta.
  calculation: 'Se ordenan las solicitudes respondidas por su tiempo de espera y se toma la del medio: la mitad
    esperó menos y la otra mitad más.'
  formula: median(first_response_at - created_at) [hours]
  unit: hours
  granularity: Una fila por solicitud; se revisa cada semana por prioridad y por equipo.
  direction: lower_is_better
  target: 2.0
  thresholds:
    green: 2.0
    amber: 4.0
  target_why: Dos horas es lo que un cliente tolera sin volver a llamar; más allá, duplica contactos.
  owner: Jefe de mesa de ayuda
  source: Sistema de solicitudes
  input:
    table: tickets
    columns:
    - first_response_hours
  how_to_read: 'La mitad de las solicitudes recibió respuesta antes de este tiempo. Conviene mirarlo por prioridad:
    un buen valor general puede esconder urgencias que esperaron toda la noche.'
  misreadings:
  - 'Usar el promedio: unas pocas solicitudes respondidas después de un fin de semana lo disparan.'
  - 'Contar las respuestas automáticas como primera respuesta: el indicador queda perfecto y sin sentido.'
  - 'Olvidar las solicitudes sin respuesta: no son rápidas, siguen esperando; se ven en las pendientes.'
  decision: Reforzar la recepción (turnos, reglas de asignación) cuando la espera inicial supera la meta.
  balance: 'Se equilibra con «resuelto en el primer contacto»: responder rápido no sirve si la respuesta no resuelve.'
  related:
  - resolution_time
  - sla_compliance
  chart:
    type: line
    why: Una línea semanal contra la meta responde a la pregunta «¿nos estamos desviando?».
  sql: |-
    WITH x AS (
      SELECT first_response_hours AS v,
             ROW_NUMBER() OVER (ORDER BY first_response_hours) AS rn,
             COUNT(*) OVER () AS n
      FROM tickets WHERE first_response_hours IS NOT NULL)
    SELECT AVG(v) FROM x WHERE rn IN ((n + 1) / 2, (n + 2) / 2)
- id: resolution_time
  name: Tiempo de resolución
  case: service
  question: ¿Cuánto tardamos en resolver el problema del cliente de principio a fin?
  meaning: Horas desde que llega la solicitud hasta que queda resuelta; se usa el valor típico (la mediana).
  definition: Mediana de horas desde la creación hasta la resolución, sobre las solicitudes ya resueltas.
  calculation: Se toman las solicitudes cerradas, se ordenan por su duración y se toma la del medio.
  formula: median(resolved_at - created_at) for status = resolved [hours]
  unit: hours
  granularity: Una fila por solicitud; se revisa cada semana por prioridad y por equipo.
  direction: lower_is_better
  target: 24.0
  thresholds:
    green: 24.0
    amber: 36.0
  target_why: Un día hábil cubre la mayoría de las solicitudes simples sin acumular pendientes.
  owner: Jefe de mesa de ayuda
  source: Sistema de solicitudes
  input:
    table: tickets
    columns:
    - status
    - resolution_hours
  how_to_read: 'Es la espera típica. Siempre va acompañado de la cola larga: «9 de cada 10 se cierran en menos de
    X horas». Los clientes que reclaman están en esa cola, no en el centro.'
  misreadings:
  - El promedio se infla por unas pocas solicitudes muy antiguas; la mediana sola las esconde. Hay que mostrar las
    dos o el «9 de cada 10».
  - 'Solo cuenta las solicitudes ya cerradas: si se acumulan las difíciles sin cerrar, el indicador mejora aunque
    el servicio empeore.'
  - Hay que decir si son horas de reloj u horas hábiles; mezclarlas entre equipos impide comparar.
  decision: 'Decidir dónde reforzar la capacidad: el equipo cuya cola larga crece es el primero en atenderse.'
  balance: 'Se equilibra con la tasa de reapertura: cerrar rápido no vale si la solicitud vuelve.'
  related:
  - first_response_time
  - sla_compliance
  - backlog_aged_share
  - reopen_rate
  chart:
    type: histogram
    why: La distribución, con la mediana y el «9 de cada 10» marcados, muestra la cola larga que un solo número
      esconde.
  sql: |-
    WITH x AS (
      SELECT resolution_hours AS v,
             ROW_NUMBER() OVER (ORDER BY resolution_hours) AS rn,
             COUNT(*) OVER () AS n
      FROM tickets WHERE status = 'resolved')
    SELECT AVG(v) FROM x WHERE rn IN ((n + 1) / 2, (n + 2) / 2)
- id: sla_compliance
  name: Cumplimiento del plazo comprometido
  case: service
  question: ¿Qué parte de las solicitudes resolvimos dentro del plazo que prometimos?
  meaning: De cada 100 solicitudes cerradas, cuántas se resolvieron dentro del plazo comprometido con el cliente
    (SLA) según su urgencia.
  definition: Solicitudes resueltas dentro del plazo de su prioridad, dividido entre todas las solicitudes resueltas.
  calculation: Se cuentan las solicitudes cerradas a tiempo y se dividen entre todas las cerradas.
  formula: count(resolution_hours <= sla_target_hours) / count(resolved)
  unit: percent
  granularity: Una fila por solicitud; se revisa cada semana y cada mes por prioridad y por equipo.
  direction: higher_is_better
  target: 0.9
  thresholds:
    green: 0.9
    amber: 0.85
  target_why: 90 de cada 100 deja margen para los casos realmente complejos sin romper la promesa.
  owner: Jefe de mesa de ayuda
  source: Sistema de solicitudes
  input:
    table: tickets
    columns:
    - status
    - resolution_hours
    - sla_target_hours
  how_to_read: Es la promesa cumplida. Cuando baja, el cliente ya lo sintió; las solicitudes pendientes antiguas
    avisan de esa caída dos o tres semanas antes.
  misreadings:
  - 'Es un indicador atrasado: se mide al cerrar, así que las solicitudes que hoy están venciendo todavía no aparecen.'
  - Pausar el reloj («esperando al cliente») sin auditar esas pausas infla el cumplimiento.
  - 'Un número general mezcla urgencias y casos simples: un 95 % puede convivir con las urgencias fuera de plazo.'
  decision: Activar un plan de recuperación en el equipo o la prioridad que baja de la meta.
  balance: Se equilibra con las solicitudes pendientes antiguas, que anticipan su caída.
  related:
  - resolution_time
  - backlog_aged_share
  chart:
    type: bullet
    why: Valor contra meta y franja de alerta en un vistazo; por equipo, en barras.
  sql: |-
    SELECT CAST(SUM(CASE WHEN resolution_hours <= sla_target_hours THEN 1 ELSE 0 END) AS REAL) / COUNT(*)
    FROM tickets WHERE status = 'resolved'
- id: backlog_aged_share
  name: Pendientes con más de 7 días
  case: service
  question: ¿Qué parte del trabajo pendiente ya es tan antiguo que pone en riesgo el plazo?
  meaning: De las solicitudes que siguen abiertas al cierre, qué parte lleva más de 7 días esperando.
  definition: Solicitudes abiertas a la fecha de corte con más días de antigüedad que el límite, dividido entre
    todas las abiertas a esa fecha.
  calculation: Se toma la foto de las solicitudes abiertas al cierre, se cuentan las que llevan más de 7 días y
    se dividen entre todas las abiertas.
  formula: count(open AND age_days > age_limit_days) / count(open)
  unit: percent
  granularity: Foto de las solicitudes abiertas; se toma cada día o cada semana por equipo.
  direction: lower_is_better
  target: 0.1
  thresholds:
    green: 0.1
    amber: 0.2
  params:
    age_limit_days: 7
  target_why: Si más de 1 de cada 10 pendientes pasa de 7 días, el plazo de las prioridades bajas ya está comprometido.
  owner: Coordinador de equipo
  source: Sistema de solicitudes
  input:
    table: tickets
    columns:
    - status
    - age_days
  how_to_read: 'Es un indicador adelantado: lo que hoy es antiguo será un incumplimiento cuando se cierre. Si las
    pendientes antiguas crecen mientras el total se mantiene, el equipo está atendiendo primero lo fácil.'
  misreadings:
  - 'Mirar solo cuántas pendientes hay: el total puede quedarse igual mientras su antigüedad se dispara.'
  - 'Comparar una foto del lunes temprano con una del viernes en la tarde: hay que fijar el momento de la foto.'
  - 'Compararlo con el tiempo de resolución sin aclarar que miden grupos distintos: uno las abiertas y el otro las
    cerradas.'
  decision: Organizar una limpieza de pendientes antiguas antes de que se conviertan en incumplimientos.
  balance: 'Se equilibra con el cumplimiento del plazo: uno avisa, el otro confirma.'
  related:
  - sla_compliance
  - resolution_time
  chart:
    type: bar
    why: Barras apiladas por antigüedad y equipo muestran dónde está el trabajo viejo.
  sql: |-
    SELECT CAST(SUM(CASE WHEN age_days > ${age_limit_days} THEN 1 ELSE 0 END) AS REAL) / COUNT(*)
    FROM tickets WHERE status = 'open'
- id: first_contact_resolution
  name: Resuelto en el primer contacto
  case: service
  question: ¿Con qué frecuencia resolvemos el problema en una sola interacción?
  meaning: De cada 100 solicitudes cerradas, cuántas se resolvieron en el primer contacto, sin volver a llamar y
    sin reabrirse.
  definition: Solicitudes resueltas con un solo contacto del cliente y sin reapertura, dividido entre todas las
    resueltas.
  calculation: Se cuentan las solicitudes cerradas con un único contacto y que no se reabrieron, y se dividen entre
    todas las cerradas.
  formula: count(contacts = 1 AND NOT reopened) / count(resolved)
  unit: percent
  granularity: Una fila por solicitud; se revisa cada mes por canal y por equipo.
  direction: higher_is_better
  target: 0.7
  thresholds:
    green: 0.7
    amber: 0.6
  target_why: 7 de cada 10 es alcanzable con buena base de conocimiento; menos indica falta de capacitación o de
    autoridad.
  owner: Jefe de mesa de ayuda
  source: Sistema de solicitudes
  input:
    table: tickets
    columns:
    - status
    - contacts
    - reopened
  how_to_read: 'Mide el esfuerzo que le ahorramos al cliente. Conviene compararlo por canal: teléfono y chat suelen
    ser distintos por naturaleza.'
  misreadings:
  - 'Contar como resuelta en el primer contacto una solicitud que luego se reabre: aquí las reabiertas no cuentan.'
  - Subirlo cerrando antes de tiempo se nota después en la tasa de reapertura; hay que leerlos juntos.
  decision: Decidir en qué canal invertir en capacitación o en base de conocimiento.
  balance: Se equilibra con la tasa de reapertura.
  related:
  - reopen_rate
  - resolution_time
  chart:
    type: bar
    why: Comparación entre canales, ordenada, contra la meta.
  sql: |-
    SELECT CAST(SUM(CASE WHEN contacts = 1 AND reopened = 0 THEN 1 ELSE 0 END) AS REAL) / COUNT(*)
    FROM tickets WHERE status = 'resolved'
- id: reopen_rate
  name: Tasa de reapertura
  case: service
  question: ¿Con qué frecuencia una solicitud «resuelta» en realidad no lo estaba?
  meaning: De cada 100 solicitudes cerradas, cuántas tuvieron que reabrirse porque el problema seguía.
  definition: Solicitudes resueltas que se reabrieron al menos una vez, dividido entre todas las resueltas.
  calculation: Se cuentan las solicitudes reabiertas y se dividen entre todas las cerradas.
  formula: count(reopened) / count(resolved)
  unit: percent
  granularity: Una fila por solicitud; se revisa cada mes por equipo.
  direction: lower_is_better
  target: 0.05
  thresholds:
    green: 0.05
    amber: 0.08
  target_why: Por encima de 5 de cada 100 la rapidez empieza a pagarse con calidad.
  owner: Responsable de calidad del servicio
  source: Sistema de solicitudes
  input:
    table: tickets
    columns:
    - status
    - reopened
  how_to_read: 'Es el contrapeso de cualquier indicador de velocidad: si el tiempo de resolución mejora y las reaperturas
    suben, la rapidez se compró con calidad.'
  misreadings:
  - 'Leerlo sin ventana de tiempo: las reaperturas llegan días después, así que las últimas semanas siempre parecen
    mejores de lo que son.'
  decision: Revisar la calidad del cierre en el equipo cuyas reaperturas suben.
  balance: Se equilibra con el tiempo de resolución.
  related:
  - first_contact_resolution
  - resolution_time
  chart:
    type: line
    why: Tendencia junto al tiempo de resolución para ver si la rapidez se pagó con calidad.
  sql: |-
    SELECT CAST(SUM(CASE WHEN reopened = 1 THEN 1 ELSE 0 END) AS REAL) / COUNT(*)
    FROM tickets WHERE status = 'resolved'
- id: mtbf
  name: Tiempo medio entre fallas
  case: maintenance
  question: ¿Cuánto tiempo funciona un equipo, en promedio, antes de fallar?
  meaning: Horas de operación que pasan, en promedio, entre una falla y la siguiente. Más alto es mejor.
  definition: Horas totales de operación divididas entre el número de fallas en el mismo periodo y alcance.
  calculation: Se suman las horas que operaron los equipos y se dividen entre las fallas que tuvieron.
  formula: sum(operating_hours) / sum(failures)
  unit: hours
  granularity: Equipo × mes; se agrupa por tipo de equipo.
  direction: higher_is_better
  target: 150.0
  thresholds:
    green: 150.0
    amber: 100.0
  target_why: 150 horas equivale a menos de una falla cada dos semanas por máquina en dos turnos.
  owner: Ingeniero de confiabilidad
  source: Datos de proceso (AI4I 2020) asignados a una flota de máquinas + órdenes de trabajo simuladas
  input:
    table: asset_periods
    columns:
    - operating_hours
    - failures
  how_to_read: Más alto significa más confiable. Se calcula sumando horas y fallas del periodo, nunca promediando
    los valores de cada mes (los meses sin fallas rompen ese promedio).
  misreadings:
  - Promediar el valor de cada equipo en vez de sumar horas y fallas sobrevalora a los equipos que casi no se usan.
  - Usar horas de calendario en vez de horas de operación premia a los equipos parados.
  - Con pocas fallas el valor salta mucho; hay que mostrar el número de fallas al lado.
  decision: Elegir qué equipos necesitan un análisis de causa raíz.
  balance: 'Se equilibra con el tiempo medio de reparación: juntos explican la disponibilidad.'
  related:
  - mttr
  - availability
  - planned_work_share
  chart:
    type: bar
    why: 'Barras por equipo: los más bajos son la lista de trabajo de confiabilidad.'
  sql: |-
    SELECT CAST(SUM(operating_hours) AS REAL) / SUM(failures) FROM asset_periods
- id: mttr
  name: Tiempo medio de reparación
  case: maintenance
  question: Cuando un equipo falla, ¿cuánto tarda en volver a funcionar?
  meaning: Horas promedio que dura una reparación, desde la falla hasta que el equipo vuelve a operar. Más bajo
    es mejor.
  definition: Promedio de horas de reparación de las órdenes de trabajo correctivas.
  calculation: Se suman las horas de todas las reparaciones correctivas y se dividen entre el número de reparaciones.
  formula: mean(repair_hours) for wo_type = corrective
  unit: hours
  granularity: Orden de trabajo correctiva; se revisa cada mes por equipo y tipo de falla.
  direction: lower_is_better
  target: 4.0
  thresholds:
    green: 4.0
    amber: 6.0
  target_why: Cuatro horas es una reparación de medio turno con repuestos a mano.
  owner: Supervisor de mantenimiento
  source: Órdenes de trabajo (simuladas)
  input:
    table: work_orders
    columns:
    - wo_type
    - repair_hours
  how_to_read: 'Se mantiene como promedio para que se cumpla disponibilidad ≈ tiempo entre fallas ÷ (tiempo entre
    fallas + tiempo de reparación). Como hay reparaciones muy largas, siempre se mira también la reparación típica
    (mediana) y las más largas: la espera de repuestos suele vivir ahí.'
  misreadings:
  - 'Promedio frente a mediana: unas pocas reparaciones esperando repuestos pueden duplicar el promedio sin que
    cambie la reparación típica.'
  - Tiempo de reparación no es tiempo de llegada; mezclarlos esconde dónde está la demora.
  decision: Decidir si el problema son los repuestos, las habilidades o el acceso al equipo.
  balance: Se equilibra con el tiempo medio entre fallas.
  related:
  - mtbf
  - availability
  chart:
    type: boxplot
    why: La distribución de reparaciones muestra si el promedio lo arrastra una cola larga.
  sql: |-
    SELECT AVG(repair_hours) FROM work_orders WHERE wo_type = 'corrective'
- id: availability
  name: Disponibilidad
  case: maintenance
  question: Del tiempo en que el equipo debía funcionar, ¿cuánto pudo funcionar de verdad?
  meaning: De cada 100 horas programadas para producir, cuántas el equipo estuvo funcionando (sin contar las paradas
    planificadas).
  definition: Horas programadas menos paradas no planificadas, divididas entre las horas programadas.
  calculation: A las horas programadas se les restan las horas perdidas por fallas y el resultado se divide entre
    las horas programadas.
  formula: (sum(scheduled_hours) - sum(unplanned_downtime_hours)) / sum(scheduled_hours)
  unit: percent
  granularity: Equipo × mes.
  direction: higher_is_better
  target: 0.97
  thresholds:
    green: 0.97
    amber: 0.95
  target_why: 97 % deja cerca de una hora perdida por cada 33 programadas, un nivel típico de una planta bien mantenida.
  owner: Jefe de mantenimiento
  source: Datos de proceso (AI4I 2020) + órdenes de trabajo simuladas
  input:
    table: asset_periods
    columns:
    - scheduled_hours
    - unplanned_downtime_hours
  how_to_read: 'Es el resultado que siente operaciones. Se descompone en dos: si un equipo falla poco pero tarda
    en repararse, el problema es la reparación; si falla mucho, es la confiabilidad.'
  misreadings:
  - Definir distinto el tiempo programado (24/7 frente a turnos) hace incomparables a dos plantas; hay que decir
    cuál es el denominador.
  - Excluir las paradas cortas de pocos minutos puede esconder buena parte del tiempo perdido.
  decision: Priorizar qué equipos reciben atención primero y de qué tipo (confiabilidad o reparación).
  balance: Se equilibra con el cumplimiento del preventivo, que la anticipa.
  related:
  - mtbf
  - mttr
  chart:
    type: line
    why: Tendencia mensual contra la meta.
  sql: |-
    SELECT CAST(SUM(scheduled_hours) - SUM(unplanned_downtime_hours) AS REAL) / SUM(scheduled_hours)
    FROM asset_periods
- id: pm_compliance
  name: Cumplimiento del mantenimiento preventivo
  case: maintenance
  question: ¿Hacemos el mantenimiento preventivo que planificamos, cuando lo planificamos?
  meaning: De cada 100 mantenimientos preventivos programados, cuántos se hicieron a tiempo (hasta 3 días después
    de la fecha).
  definition: Órdenes preventivas terminadas a más tardar en la fecha programada más la tolerancia, divididas entre
    las preventivas programadas en el periodo.
  calculation: Se cuentan los preventivos hechos dentro de la tolerancia y se dividen entre los programados.
  formula: count(preventive AND completed_at <= due_date + tolerance_days) / count(preventive due)
  unit: percent
  granularity: Orden preventiva; se revisa cada mes por equipo y cuadrilla.
  direction: higher_is_better
  target: 0.9
  thresholds:
    green: 0.9
    amber: 0.8
  params:
    tolerance_days: 3
  target_why: Con 9 de cada 10 preventivos a tiempo, el riesgo que queda abierto es pequeño y controlado.
  owner: Planificador de mantenimiento
  source: Órdenes de trabajo (simuladas)
  input:
    table: work_orders
    columns:
    - wo_type
    - due_date
    - completed_at
  how_to_read: 'Es un indicador adelantado de la confiabilidad: los preventivos atrasados o saltados aparecen como
    fallas semanas después.'
  misreadings:
  - Contar como «hecho» un preventivo hecho tres semanas tarde esconde el periodo de riesgo; la tolerancia hace
    visible el atraso.
  - Mover la fecha programada a la fecha en que se hizo deja el cumplimiento en 100 % por construcción; hay que
    auditar los cambios de fecha.
  decision: Reprogramar la semana de la cuadrilla que se atrasa.
  balance: Se equilibra con la parte planificada del trabajo y con el tiempo entre fallas.
  related:
  - planned_work_share
  - mtbf
  chart:
    type: bar
    why: 'Barras por equipo de menor a mayor: los peores son la lista de acción.'
  sql: |-
    SELECT CAST(SUM(CASE WHEN completed_at IS NOT NULL
                          AND julianday(completed_at) <= julianday(due_date) + ${tolerance_days} THEN 1 ELSE 0 END) AS REAL) / COUNT(*)
    FROM work_orders WHERE wo_type = 'preventive'
- id: planned_work_share
  name: Trabajo de mantenimiento planificado
  case: maintenance
  question: ¿Qué parte del esfuerzo de mantenimiento es planificado y no una reacción a fallas?
  meaning: De cada 100 horas de mantenimiento, cuántas fueron trabajo planificado y no reparaciones de emergencia.
  definition: Horas de trabajo en órdenes planificadas divididas entre todas las horas de mantenimiento.
  calculation: Se suman las horas de las órdenes planificadas y se dividen entre todas las horas de mantenimiento.
  formula: sum(labor_hours where planned) / sum(labor_hours)
  unit: percent
  granularity: Orden de trabajo; se revisa cada mes por cuadrilla.
  direction: higher_is_better
  target: 0.8
  thresholds:
    green: 0.8
    amber: 0.65
  target_why: Cuando 8 de cada 10 horas son planificadas, las emergencias dejan de mandar sobre la agenda.
  owner: Jefe de mantenimiento
  source: Órdenes de trabajo (simuladas)
  input:
    table: work_orders
    columns:
    - planned
    - labor_hours
  how_to_read: 'Indica madurez: el trabajo reactivo cuesta más y detiene la producción. Se mueve despacio; se lee
    cada trimestre.'
  misreadings:
  - 'Contar órdenes en vez de horas: muchas inspecciones pequeñas pueden esconder unas pocas averías enormes.'
  - Subirlo llamando «planificado» a un trabajo de emergencia del mismo día; planificado significa programado con
    anticipación.
  decision: Decidir cuánto trabajo correctivo convertir en preventivo.
  balance: Se equilibra con el cumplimiento del preventivo.
  related:
  - pm_compliance
  - mtbf
  chart:
    type: bar
    why: Barra de 100 % por mes con dos partes, o una línea contra la meta.
  sql: |-
    SELECT CAST(SUM(CASE WHEN planned = 1 THEN labor_hours ELSE 0 END) AS REAL) / SUM(labor_hours)
    FROM work_orders
- id: fill_rate
  name: Unidades atendidas
  case: inventory
  question: De las unidades que pidieron los clientes, ¿cuántas despachamos?
  meaning: De cada 100 unidades pedidas, cuántas se despacharon desde el inventario.
  definition: Unidades despachadas divididas entre unidades pedidas.
  calculation: Se suman las unidades despachadas y se dividen entre las unidades pedidas.
  formula: sum(qty_shipped) / sum(qty_ordered)
  unit: percent
  granularity: Línea de pedido; se revisa cada semana por tipo de producto.
  direction: higher_is_better
  target: 0.95
  thresholds:
    green: 0.95
    amber: 0.9
  target_why: 95 de cada 100 unidades atendidas es un nivel de servicio habitual en distribución minorista.
  owner: Planificador de abastecimiento
  source: Líneas de pedido (demanda de UCI Online Retail II) + simulación de inventario
  input:
    table: order_lines
    columns:
    - qty_ordered
    - qty_shipped
  how_to_read: 'Pesa por volumen: los productos grandes lo dominan, así que un buen valor puede convivir con muchos
    productos pequeños agotados. Se lee junto a los quiebres de stock.'
  misreadings:
  - Unidades atendidas, líneas atendidas y pedidos atendidos son tres indicadores distintos; hay que decir cuál.
  - Las ventas perdidas que nunca se pidieron (el cliente vio «agotado») no aparecen aquí.
  decision: Ajustar el inventario de seguridad de los productos que más fallan.
  balance: Se equilibra con «pedidos completos y a tiempo», que es más exigente.
  related:
  - otif
  - stockout_rate
  - days_of_cover
  chart:
    type: line
    why: Tendencia semanal contra la meta con los quiebres marcados.
  sql: |-
    SELECT CAST(SUM(qty_shipped) AS REAL) / SUM(qty_ordered) FROM order_lines
- id: otif
  name: Pedidos completos y a tiempo
  case: inventory
  question: ¿Cuántos pedidos llegaron completos y en la fecha prometida?
  meaning: De cada 100 pedidos, cuántos llegaron con todas sus líneas completas y a tiempo.
  definition: Pedidos cuyas líneas se entregaron todas a más tardar en la fecha prometida y con la cantidad completa,
    divididos entre todos los pedidos.
  calculation: Un pedido cuenta como bien atendido solo si todas sus líneas llegaron completas y a tiempo; se cuentan
    esos pedidos y se dividen entre todos.
  formula: count(orders with all lines on time AND in full) / count(orders)
  unit: percent
  granularity: Pedido; se revisa cada semana.
  direction: higher_is_better
  target: 0.9
  thresholds:
    green: 0.9
    amber: 0.8
  target_why: 9 de cada 10 pedidos completos y a tiempo es lo que un cliente comercial considera confiable.
  owner: Jefe de logística
  source: Líneas de pedido (demanda de UCI Online Retail II) + simulación de inventario
  input:
    table: order_lines
    columns:
    - order_id
    - qty_ordered
    - qty_shipped
    - promised_date
    - delivered_date
  how_to_read: 'Es la mirada del cliente: una sola línea faltante arruina el pedido entero. Las fallas se separan
    siempre en «incompleto» y «tarde», porque tienen responsables distintos.'
  misreadings:
  - Es mucho más exigente que las unidades atendidas en pedidos de varias líneas; compararlos directamente engaña.
  - Usar la fecha pedida para unos clientes y la confirmada para otros cambia el indicador sin avisar.
  decision: 'Separar las fallas por responsable: lo incompleto es de planificación, lo tardío de logística.'
  balance: Se equilibra con las unidades atendidas.
  related:
  - fill_rate
  - stockout_rate
  chart:
    type: bar
    why: Barras con las fallas separadas en incompleto, tarde o ambas.
  sql: |-
    SELECT CAST(SUM(ok) AS REAL) / COUNT(*) FROM (
      SELECT order_id,
             MIN(CASE WHEN qty_shipped >= qty_ordered AND delivered_date IS NOT NULL
                       AND delivered_date <= promised_date THEN 1 ELSE 0 END) AS ok
      FROM order_lines GROUP BY order_id)
- id: inventory_turnover
  name: Rotación del inventario
  case: inventory
  question: ¿Cuántas veces al año vendemos el inventario que mantenemos?
  meaning: Cuántas veces al año se vende (a costo) el valor promedio del inventario. Más alto significa menos capital
    inmovilizado.
  definition: Costo de lo vendido, llevado a un año, dividido entre el valor promedio del inventario.
  calculation: Se suma el costo de lo vendido en el periodo, se lleva a un año y se divide entre el inventario promedio.
  formula: (sum(cogs_value) * 365 / days) / mean_daily(sum(on_hand_value))
  unit: times_per_year
  granularity: Producto × día; se revisa cada mes por tipo de producto.
  direction: higher_is_better
  target: 8.0
  thresholds:
    green: 8.0
    amber: 5.0
  target_why: Ocho vueltas al año equivalen a unas seis semanas de inventario, razonable para productos de regalo.
  owner: Controlador de inventarios
  source: Simulación de inventario sobre demanda pública
  input:
    table: inventory_daily
    columns:
    - date
    - on_hand_value
    - cogs_value
  how_to_read: 'Mide la eficiencia del capital. Más alto es mejor solo hasta el punto en que empiezan los quiebres:
    se lee junto a las unidades atendidas.'
  misreadings:
  - Usar ventas a precio en vez de a costo infla la rotación en el margen.
  - Usar el inventario de cierre de año en vez del promedio favorece a quien baja el stock justo antes del cierre.
  decision: Decidir dónde reducir inventario sin afectar el servicio.
  balance: Se equilibra con las unidades atendidas y los días de cobertura.
  related:
  - days_of_cover
  - obsolescence_share
  - fill_rate
  chart:
    type: bar
    why: Barras por tipo de producto, la comparación que define la política.
  sql: |-
    SELECT (SUM(cogs_value) * 365.0 / COUNT(DISTINCT date))
           / (SELECT AVG(v) FROM (SELECT SUM(on_hand_value) AS v FROM inventory_daily GROUP BY date))
    FROM inventory_daily
- id: days_of_cover
  name: Días de cobertura
  case: inventory
  question: Si la demanda sigue igual, ¿para cuántos días alcanza el inventario actual?
  meaning: Días que duraría el inventario de hoy con la demanda diaria promedio. Debe quedar dentro de una franja.
  definition: Unidades en inventario a la última fecha divididas entre la demanda diaria promedio del periodo.
  calculation: Se toma el inventario del último día y se divide entre lo que se vende en un día promedio.
  formula: on_hand_units(last date) / (sum(demand_units) / days)
  unit: days
  granularity: Producto; foto al cierre del periodo.
  direction: target_range
  target: 21.0
  thresholds:
    green:
    - 14.0
    - 35.0
    amber:
    - 7.0
    - 60.0
  target_why: Entre 2 y 5 semanas cubre la demora del proveedor sin inmovilizar dinero de más.
  owner: Planificador de abastecimiento
  source: Simulación de inventario sobre demanda pública
  input:
    table: inventory_daily
    columns:
    - date
    - on_hand_units
    - demand_units
  how_to_read: Muy bajo es riesgo de quiebre antes de la próxima reposición; muy alto es capital inmovilizado y
    riesgo de obsolescencia. Por eso tiene franja y no dirección.
  misreadings:
  - Usar la demanda pasada de un producto de temporada justo antes de su temporada subestima el riesgo.
  - Un número de toda la empresa compensa productos sin cobertura con productos con un año de cobertura.
  decision: Acelerar pedidos de los productos por debajo de la franja y frenar compras de los que están por encima.
  balance: Se equilibra con la rotación y los quiebres de stock.
  related:
  - inventory_turnover
  - stockout_rate
  - obsolescence_share
  chart:
    type: histogram
    why: La distribución de productos por cobertura, con la franja sombreada, muestra los dos extremos.
  sql: |-
    SELECT (SELECT SUM(on_hand_units) FROM inventory_daily WHERE date = (SELECT MAX(date) FROM inventory_daily))
           / (SUM(demand_units) * 1.0 / COUNT(DISTINCT date))
    FROM inventory_daily
- id: stockout_rate
  name: Quiebres de stock
  case: inventory
  question: ¿Con qué frecuencia un producto simplemente no está disponible?
  meaning: De cada 100 días-producto en que el producto está activo, en cuántos terminó el día sin inventario.
  definition: Días-producto del surtido activo con inventario cero al cierre del día, divididos entre todos los
    días-producto activos. Un producto está activo entre su primera y su última demanda.
  calculation: Se cuentan los días en que cada producto activo terminó sin inventario y se dividen entre todos sus
    días activos.
  formula: count(active AND on_hand_units <= 0) / count(active sku_days)
  unit: percent
  granularity: Producto × día; se revisa cada semana por tipo de producto.
  direction: lower_is_better
  target: 0.03
  thresholds:
    green: 0.03
    amber: 0.06
  target_why: Con 3 días sin producto de cada 100 el cliente casi nunca encuentra la estantería vacía.
  owner: Planificador de abastecimiento
  source: Simulación de inventario sobre demanda pública
  input:
    table: inventory_daily
    columns:
    - on_hand_units
    - active
  how_to_read: 'No pesa por volumen, así que muestra la amplitud del problema: muchos productos pequeños agotados
    lo suben aunque las unidades atendidas sigan altas.'
  misreadings:
  - El inventario al cierre del día no ve los quiebres durante el día; en productos de alta rotación se queda corto.
  - Incluir productos descontinuados o aún no lanzados lo infla; aquí solo cuenta el surtido activo.
  decision: Revisar el inventario de seguridad de los productos que más se agotan.
  balance: Se equilibra con las unidades atendidas y los días de cobertura.
  related:
  - fill_rate
  - days_of_cover
  chart:
    type: heatmap
    why: 'Tendencia semanal: muestra cuándo se concentran los quiebres.'
  sql: |-
    SELECT CAST(SUM(CASE WHEN on_hand_units <= 0 THEN 1 ELSE 0 END) AS REAL) / COUNT(*)
    FROM inventory_daily WHERE active = 1
- id: obsolescence_share
  name: Inventario sin movimiento
  case: inventory
  question: ¿Qué parte del valor de nuestro inventario dejó de moverse?
  meaning: Del valor total del inventario, qué parte está en productos que no se venden hace más de 180 días.
  definition: Valor del inventario sin movimiento por más del límite de días, dividido entre el valor total del
    inventario.
  calculation: Se suma el valor de los productos sin ventas en más de 180 días y se divide entre el valor total
    del inventario.
  formula: sum(on_hand_value where days_since_last_movement > age_limit_days) / sum(on_hand_value)
  unit: percent
  granularity: Producto; foto al cierre de mes.
  direction: lower_is_better
  target: 0.05
  thresholds:
    green: 0.05
    amber: 0.1
  params:
    age_limit_days: 180
  target_why: Más de 5 % del valor sin moverse empieza a pesar en el resultado cuando hay que rematarlo.
  owner: Controlador de inventarios
  source: Simulación de inventario sobre demanda pública
  input:
    table: inventory_snapshot
    columns:
    - on_hand_value
    - days_since_last_movement
  how_to_read: Es capital en riesgo de pérdida. Crece en silencio después de temporadas pronosticadas de más, por
    eso se lee junto al sesgo del pronóstico.
  misreadings:
  - Una sola unidad vendida «reinicia el reloj» de un pallet entero sin rotación; conviene mirar también la cobertura.
  decision: Liquidar, agrupar o devolver los productos sin movimiento y dejar de comprarlos.
  balance: Se equilibra con el sesgo del pronóstico.
  related:
  - forecast_bias
  - days_of_cover
  - inventory_turnover
  chart:
    type: bar
    why: Valor por antigüedad desde la última venta, de menor a mayor.
  sql: |-
    SELECT SUM(CASE WHEN days_since_last_movement > ${age_limit_days} THEN on_hand_value ELSE 0 END) / SUM(on_hand_value)
    FROM inventory_snapshot
- id: mape
  name: Error porcentual promedio del pronóstico
  case: inventory
  question: En promedio, ¿por qué porcentaje falla el pronóstico de cada producto?
  meaning: Error del pronóstico en porcentaje, promediando cada producto-semana por igual. Lo dominan las semanas
    de poca venta.
  definition: Promedio de |real − pronóstico| ÷ real en los producto-semana con venta mayor que cero.
  calculation: Para cada producto y semana se calcula el error como porcentaje de lo vendido y se promedian todos
    esos porcentajes.
  formula: mean(|A - F| / A) for A > 0
  unit: percent
  granularity: Producto × semana.
  direction: lower_is_better
  target: 0.4
  thresholds:
    green: 0.4
    amber: 0.6
  target_why: 40 % es un error aceptable para productos de poca venta, donde el pronóstico pesa poco.
  owner: Planificador de demanda
  source: Demanda (UCI Online Retail II) + pronóstico base calculado en este proyecto
  input:
    table: forecast
    columns:
    - actual_units
    - forecast_units
  how_to_read: Cada producto-semana pesa igual, así que dominan los productos lentos. Sirve para juzgar qué tan
    predecible es la cola larga, no la calidad general de la planificación.
  misreadings:
  - No existe cuando la venta es cero (esas filas se excluyen) y se dispara con ventas muy pequeñas.
  - 'Es asimétrico: pronosticar de más puede pasar del 100 % de error; pronosticar de menos, no.'
  - Comparar este error entre portafolios con distinta mezcla de volumen; para eso está el error ponderado.
  decision: Decidir qué productos de la cola larga se planifican con reglas simples en vez de pronóstico.
  balance: Se equilibra con el error ponderado por volumen.
  related:
  - wape
  - forecast_bias
  chart:
    type: bar
    why: El error por tamaño de la venta semanal muestra por qué difiere del error ponderado.
  sql: |-
    SELECT AVG(ABS(actual_units - forecast_units) * 1.0 / actual_units) FROM forecast WHERE actual_units > 0
- id: wape
  name: Error del pronóstico ponderado por volumen
  case: inventory
  question: De todas las unidades vendidas, ¿cuántas se equivocó el pronóstico?
  meaning: De cada 100 unidades vendidas, cuántas estuvieron mal pronosticadas (de más o de menos).
  definition: Suma de los errores absolutos dividida entre la suma de lo vendido.
  calculation: Se suman las diferencias entre pronóstico y venta (sin signo) y se dividen entre el total vendido.
  formula: sum(|A - F|) / sum(A)
  unit: percent
  granularity: Producto × semana; se agrupa por tipo de producto.
  direction: lower_is_better
  target: 0.3
  thresholds:
    green: 0.3
    amber: 0.45
  target_why: 30 % de unidades mal pronosticadas se cubre con inventario de seguridad razonable.
  owner: Planificador de demanda
  source: Demanda (UCI Online Retail II) + pronóstico base calculado en este proyecto
  input:
    table: forecast
    columns:
    - actual_units
    - forecast_units
  how_to_read: 'Pondera por volumen: dominan los productos grandes, que es lo que sienten el inventario y el servicio.
    Es el indicador principal de precisión.'
  misreadings:
  - Calcularlo a nivel muy agregado hace que los errores se cancelen (un producto de más, otro de menos); se calcula
    por producto y luego se suma.
  decision: Elegir qué productos necesitan un mejor método de pronóstico.
  balance: 'Se equilibra con el sesgo: uno dice cuánto falla, el otro hacia qué lado.'
  related:
  - mape
  - forecast_bias
  chart:
    type: line
    why: Tendencia mensual con los picos de temporada marcados.
  sql: |-
    SELECT SUM(ABS(actual_units - forecast_units)) * 1.0 / SUM(actual_units) FROM forecast
- id: forecast_bias
  name: Sesgo del pronóstico
  case: inventory
  question: ¿Pronosticamos sistemáticamente de más o de menos?
  meaning: Cuánto se pasa (positivo) o se queda corto (negativo) el pronóstico frente a lo vendido. Lo ideal es
    cerca de cero.
  definition: (Suma del pronóstico − suma de lo vendido) ÷ suma de lo vendido. Positivo = pronóstico de más.
  calculation: Se resta lo vendido de lo pronosticado y se divide entre lo vendido, conservando el signo.
  formula: (sum(F) - sum(A)) / sum(A)
  unit: percent
  granularity: Producto × semana; se agrupa por tipo de producto y mes.
  direction: target_range
  target: 0.0
  thresholds:
    green:
    - -0.05
    - 0.05
    amber:
    - -0.1
    - 0.1
  target_why: Hasta 5 % de desvío en cualquier sentido es ruido normal; más es un error de método.
  owner: Planificador de demanda
  source: Demanda (UCI Online Retail II) + pronóstico base calculado en este proyecto
  input:
    table: forecast
    columns:
    - actual_units
    - forecast_units
  how_to_read: Es el error que se puede corregir. La precisión dice qué tan grande es la falla; el sesgo dice hacia
    qué lado. El sesgo positivo persistente acumula inventario sin movimiento; el negativo, quiebres.
  misreadings:
  - Un sesgo cercano a cero puede esconder errores grandes que se cancelan; nunca se lee sin el error ponderado.
  decision: Corregir el método de pronóstico en los meses con sesgo fuera de la franja.
  balance: Se equilibra con el error ponderado por volumen.
  related:
  - wape
  - obsolescence_share
  - stockout_rate
  chart:
    type: bar
    why: Barras por mes alrededor de cero con la franja aceptable sombreada.
  sql: |-
    SELECT (SUM(forecast_units) - SUM(actual_units)) * 1.0 / SUM(actual_units) FROM forecast
- id: retention_rate
  name: Clientes que vuelven a comprar
  case: customers
  question: De los clientes que compraron el trimestre pasado, ¿cuántos volvieron a comprar este trimestre?
  meaning: De cada 100 clientes que compraron en un trimestre, cuántos volvieron a comprar en el siguiente.
  definition: Clientes activos en el trimestre anterior y en el actual, divididos entre los clientes activos en
    el trimestre anterior.
  calculation: Se cuentan los clientes del trimestre anterior que también compraron en el actual y se dividen entre
    los del trimestre anterior.
  formula: '|active(t-1) ∩ active(t)| / |active(t-1)|'
  unit: percent
  granularity: Cliente × trimestre.
  direction: higher_is_better
  target: 0.5
  thresholds:
    green: 0.5
    amber: 0.4
  params:
    period: QUARTER
  target_why: Si la mitad de los clientes vuelve cada trimestre, la base de ingresos se sostiene sin depender solo
    de clientes nuevos.
  owner: Responsable de relación con clientes
  source: Transacciones (UCI Online Retail II)
  input:
    table: sales
    columns:
    - customer_id
    - invoice_date
  how_to_read: 'Es la base de los ingresos recurrentes. Conviene verlo por año de primera compra: un valor estable
    puede esconder que los clientes nuevos se van más rápido.'
  misreadings:
  - La duración del periodo cambia todo (mensual < trimestral < anual); siempre hay que decir el periodo.
  - 'Las compras sin cliente identificado se excluyen: si esa parte cambia, el indicador se mueve sin razón de negocio.'
  decision: Decidir si hay que invertir en retener clientes o en captar nuevos.
  balance: Se equilibra con el ingreso en riesgo, que dice a quién llamar.
  related:
  - repeat_purchase_rate
  - revenue_at_risk_share
  chart:
    type: line
    why: Tendencia trimestral.
- id: repeat_purchase_rate
  name: Clientes con más de una compra
  case: customers
  question: ¿Qué parte de los clientes vuelve por una segunda compra?
  meaning: De cada 100 clientes del último año, cuántos compraron dos veces o más.
  definition: Clientes con dos o más facturas en la ventana de 12 meses, divididos entre los clientes con al menos
    una.
  calculation: Se cuentan los clientes con dos o más compras distintas y se dividen entre todos los clientes del
    periodo.
  formula: count(customers with invoices >= 2) / count(customers)
  unit: percent
  granularity: Cliente; ventana de 12 meses.
  direction: higher_is_better
  target: 0.6
  thresholds:
    green: 0.6
    amber: 0.5
  target_why: 6 de cada 10 clientes con una segunda compra indica que la primera experiencia funcionó.
  owner: Responsable de relación con clientes
  source: Transacciones (UCI Online Retail II)
  input:
    table: sales
    columns:
    - customer_id
    - invoice_id
  how_to_read: '¿La primera compra se convierte en relación? Los clientes que llegaron al final de la ventana tuvieron
    menos tiempo para repetir: hay que comparar grupos parecidos.'
  misreadings:
  - Contar líneas de factura en vez de facturas distintas convierte cada compra de varios productos en «repetida».
  decision: Diseñar acciones para la segunda compra de los clientes nuevos.
  balance: Se equilibra con los clientes que vuelven a comprar.
  related:
  - retention_rate
  - revenue_at_risk_share
  chart:
    type: bar
    why: Barras por año de primera compra, contra la meta.
  sql: |-
    SELECT CAST(SUM(CASE WHEN n >= 2 THEN 1 ELSE 0 END) AS REAL) / COUNT(*)
    FROM (SELECT customer_id, COUNT(DISTINCT invoice_id) AS n FROM sales GROUP BY customer_id)
- id: revenue_at_risk_share
  name: Ingreso en riesgo
  case: customers
  question: ¿Cuánto de nuestro ingreso viene de buenos clientes que dejaron de comprar?
  meaning: Del ingreso del último año, qué parte vino de clientes buenos que ahora están inactivos («en riesgo»).
  definition: Ingreso de los últimos 12 meses de los clientes del segmento «en riesgo» (compraban seguido y bastante,
    pero hace tiempo que no compran), dividido entre el ingreso total.
  calculation: Se clasifica a cada cliente por qué tan reciente, frecuente y grande es su compra; se suma el ingreso
    de los «en riesgo» y se divide entre el total.
  formula: sum(monetary where segment = 'En riesgo') / sum(monetary)
  unit: percent
  granularity: Cliente; se recalcula cada mes sobre 12 meses.
  direction: lower_is_better
  target: 0.1
  thresholds:
    green: 0.1
    amber: 0.2
  target_why: Hasta 10 % del ingreso en clientes inactivos es manejable con una campaña; más es un riesgo para el
    año.
  owner: Responsable de relación con clientes
  source: Transacciones (UCI Online Retail II), segmentación calculada en este proyecto
  input:
    table: customer_rfm
    columns:
    - segment
    - monetary
  how_to_read: 'Es el tamaño de la oportunidad de recuperación. La lista de clientes del segmento es la lista de
    acción: se llama primero a los que más compraban.'
  misreadings:
  - 'Los puntajes son relativos a estos datos (quintiles): «en riesgo» es una etiqueta relativa, no absoluta.'
  - La recencia depende de la fecha de corte; hay que recalcular siempre en la misma fecha del calendario.
  decision: Lanzar una campaña de recuperación con la lista ordenada por ingreso.
  balance: Se equilibra con los clientes que vuelven a comprar.
  related:
  - retention_rate
  - repeat_purchase_rate
  - nps
  chart:
    type: bar
    why: Ingreso por segmento, ordenado, con «en riesgo» destacado.
  sql: |-
    SELECT SUM(CASE WHEN segment = 'En riesgo' THEN monetary ELSE 0 END) / SUM(monetary) FROM customer_rfm
- id: nps
  name: Recomendación de clientes (encuesta simulada)
  case: customers
  question: ¿Nos recomendarían nuestros clientes?
  meaning: Porcentaje de clientes que nos recomendarían (nota 9–10) menos el de los que hablarían mal (nota 0–6).
    Va de −100 a +100.
  definition: Porcentaje de promotores (nota 9–10) menos porcentaje de detractores (nota 0–6) entre quienes respondieron.
    Los neutros (7–8) solo cuentan en el total.
  calculation: Se calcula qué porcentaje dio 9 o 10, qué porcentaje dio 0 a 6, y se restan.
  formula: 100 * (count(score >= 9) - count(score <= 6)) / count(responses)
  unit: score
  granularity: Respuesta de encuesta; se informa cada mes con su número de respuestas.
  direction: higher_is_better
  target: 30.0
  thresholds:
    green: 30.0
    amber: 10.0
  target_why: Un resultado de +30 indica clara mayoría de clientes que recomiendan.
  owner: Responsable de experiencia del cliente
  source: Encuesta simulada
  input:
    table: survey
    columns:
    - score
  how_to_read: 'Va de −100 a +100; no es un porcentaje ni un promedio. Con pocas respuestas el margen de error es
    amplio: siempre se muestra cuántas respuestas hubo.'
  misreadings:
  - Promediar las notas de 0 a 10 (por ejemplo 7.8/10) no es este indicador y esconde la polarización.
  - Promediar los valores de cada segmento sin ponderar por respuestas da un total equivocado.
  - Tomar como real un cambio de 3 puntos cuando el margen de error es de ± 8 puntos.
  decision: Llamar a los detractores en 48 horas y corregir la causa más repetida.
  balance: Se equilibra con el ingreso en riesgo.
  related:
  - revenue_at_risk_share
  - retention_rate
  chart:
    type: bar
    why: Barra de 100 % con tres grupos (solo tres partes) y el resultado como etiqueta.
  sql: |-
    SELECT 100.0 * (SUM(CASE WHEN score >= 9 THEN 1 ELSE 0 END) - SUM(CASE WHEN score <= 6 THEN 1 ELSE 0 END)) / COUNT(*)
    FROM survey
- id: dq_completeness
  name: Completitud de los datos
  case: data_quality
  question: ¿Están llenos los campos que necesitamos?
  meaning: De cada 100 celdas obligatorias, cuántas tienen un valor.
  definition: Celdas no vacías en las columnas obligatorias divididas entre todas las celdas obligatorias.
  calculation: Se cuentan las celdas obligatorias con valor y se dividen entre todas las celdas obligatorias.
  formula: count(non-null required cells) / (rows * required columns)
  unit: percent
  granularity: Conjunto de datos × carga; las columnas obligatorias se definen en las reglas de calidad.
  direction: higher_is_better
  target: 0.99
  thresholds:
    green: 0.99
    amber: 0.95
  target_why: Con 99 de cada 100 celdas llenas, los faltantes no cambian ningún indicador de negocio.
  owner: Responsable de los datos
  source: Todos los conjuntos de datos del proyecto
  input:
    table: any
    columns: []
  how_to_read: Se mide solo en las columnas de las que depende un indicador. Un cliente sin identificar es un problema
    de negocio en cuanto se calcula la retención sin él.
  misreadings:
  - Medirlo sobre todas las columnas diluye las importantes; se limita a los campos obligatorios.
  - Los valores de relleno («N/A», 0, «desconocido») cuentan como llenos; hay que combinarlo con la validez.
  decision: Hacer obligatorio el campo faltante en el sistema de origen.
  balance: Se equilibra con la validez.
  related:
  - dq_validity
  - dq_uniqueness
  chart:
    type: heatmap
    why: Una cuadrícula conjunto de datos × dimensión, con semáforo, de un vistazo.
- id: dq_uniqueness
  name: Unicidad de los datos
  case: data_quality
  question: ¿Cada registro real está guardado una sola vez?
  meaning: De cada 100 filas, cuántas corresponden a un registro distinto (sin duplicados).
  definition: Claves de negocio distintas divididas entre el número de filas.
  calculation: Se cuentan las claves distintas y se dividen entre todas las filas.
  formula: count(distinct key) / count(rows)
  unit: percent
  granularity: Conjunto de datos × carga.
  direction: higher_is_better
  target: 1.0
  thresholds:
    green: 0.999
    amber: 0.99
  target_why: 'Casi cero duplicados: cada duplicado infla directamente un conteo de negocio.'
  owner: Responsable de los datos
  source: Todos los conjuntos de datos del proyecto
  input:
    table: any
    columns: []
  how_to_read: 'Los duplicados inflan los conteos en silencio: una solicitud duplicada es una solicitud «resuelta»
    de más en todos los indicadores de atención.'
  misreadings:
  - Los duplicados exactos son solo una parte; la misma entidad con dos claves distintas necesita comparación aproximada.
  decision: Eliminar duplicados al cargar los datos y corregir la integración que los genera.
  balance: Se equilibra con la completitud.
  related:
  - dq_completeness
  chart:
    type: heatmap
    why: La misma cuadrícula que las otras dimensiones, para compararlas.
- id: dq_validity
  name: Validez de los datos
  case: data_quality
  question: ¿Los valores respetan las reglas del negocio?
  meaning: De cada 100 filas, cuántas cumplen todas las reglas (por ejemplo, cantidad mayor que cero).
  definition: Filas que cumplen todas las reglas de validez del conjunto de datos divididas entre todas las filas.
  calculation: Se revisa cada fila contra las reglas; se cuentan las que las cumplen todas y se dividen entre todas
    las filas.
  formula: count(rows passing all rules) / count(rows)
  unit: percent
  granularity: Conjunto de datos × carga.
  direction: higher_is_better
  target: 0.98
  thresholds:
    green: 0.98
    amber: 0.95
  target_why: 98 de cada 100 filas válidas deja los errores por debajo de lo que mueve un indicador.
  owner: Responsable de los datos
  source: Todos los conjuntos de datos del proyecto
  input:
    table: any
    columns: []
  how_to_read: Las reglas expresan el sentido del negocio (cantidad mayor que cero, cierre después de la apertura).
    Cada regla incumplida es un pedido de corrección al dueño del sistema de origen.
  misreadings:
  - Una fila puede fallar varias reglas; se cuentan filas, no fallas, o el porcentaje puede salir negativo.
  decision: Pedir la corrección de la regla más incumplida al dueño del sistema de origen.
  balance: Se equilibra con la completitud.
  related:
  - dq_completeness
  chart:
    type: bar
    why: 'Fallas por regla, de mayor a menor: la lista de correcciones.'
- id: dq_timeliness
  name: Oportunidad de los datos
  case: data_quality
  question: ¿Los datos llegan a tiempo para poder actuar?
  meaning: De cada 100 registros, cuántos se cargaron en el sistema dentro de las 24 horas siguientes al hecho.
  definition: Registros cargados dentro del plazo permitido después del hecho de negocio, divididos entre todos
    los registros.
  calculation: Se compara la hora del hecho con la hora de carga y se cuentan los registros que llegaron dentro
    del plazo.
  formula: count(loaded_at - event_at <= max_delay_hours) / count(rows)
  unit: percent
  granularity: Conjunto de datos × carga.
  direction: higher_is_better
  target: 0.95
  thresholds:
    green: 0.95
    amber: 0.9
  target_why: 95 de cada 100 registros dentro de un día permite que los indicadores semanales lleguen a tiempo.
  owner: Ingeniero de datos
  source: Conjuntos de datos que registran la hora de carga
  input:
    table: any
    columns: []
  how_to_read: Los datos tardíos hacen que los indicadores adelantados lleguen tarde. Los conjuntos sin hora de
    carga no se pueden medir, y eso ya es un hallazgo.
  misreadings:
  - 'Que el último registro sea reciente no significa que todos lleguen a tiempo: los registros tardíos se esconden
    detrás de una fecha máxima reciente.'
  decision: Digitalizar el registro en el origen donde los datos llegan tarde.
  balance: Se equilibra con la completitud.
  related:
  - dq_completeness
  chart:
    type: heatmap
    why: La misma cuadrícula que las otras dimensiones.
