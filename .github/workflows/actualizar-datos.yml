name: Actualizar datos

# Descarga los datos públicos, recalcula los indicadores, corre todas las pruebas
# (fórmulas, legibilidad, coherencia de cifras y candado de privacidad) y solo entonces publica.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 7 3 * *" # el día 3 de cada mes, 07:17 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Guardar las descargas de UCI entre ejecuciones (NYC 311 se descarga siempre)
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-v1
      - name: Descargar, calcular, probar y construir el sitio
        run: make all SOURCE=auto
      - name: Resumen de las fuentes usadas
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("data/processed/manifest.json"))
          print("| Datos | Origen | Detalle |\n|---|---|---|")
          for k in ("tickets", "process_data", "work_orders", "transactions", "inventory", "survey"):
              print(f"| {m[k]['name']} | {m[k]['origin']} | {m[k]['note'][:150]} |")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
