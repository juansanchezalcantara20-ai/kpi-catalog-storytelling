name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Cache public downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-v1
      - name: Reproduce everything (lint, tests, data, pages, Power BI layer, site)
        run: make all SOURCE=auto
      - name: Publish the Power BI model tables with the site
        run: |
          mkdir -p site/data/powerbi
          cp powerbi/data/*.csv site/data/powerbi/
          cp data/processed/manifest.json site/data/powerbi/manifest.json
      - name: Power BI package as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-layer
          path: |
            powerbi/measures.dax
            powerbi/MODEL.md
            powerbi/BUILD_CHECKLIST.md
            powerbi/theme.json
            powerbi/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
