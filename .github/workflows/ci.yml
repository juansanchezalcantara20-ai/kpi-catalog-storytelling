name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Estilo del código
        run: |
          ruff check .
          ruff format --check .
      - name: Validar el catálogo
        run: python -m kpistory validate
      - name: Pruebas de fórmulas, datos y fuentes
        run: python -m pytest
      - name: Construir todo sin internet (plan B) y probar legibilidad, coherencia y privacidad
        run: make all SOURCE=synthetic
